<!DOCTYPE html>
<html lang="en">
<head>
    <title>Contact Us - Code Differently</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Poppins%3A600%2C400%7CMontserrat%3A800%2C900%2C700&ver=1597678827" type="text/css" media="all">
    <link rel="stylesheet" type="text/css" href="/style.css">
    <link rel="stylesheet" type="text/css" href="/contact.css">
</head>
<body>
    <header class="header">
        <div class="header-logo">
            <a href="/">
                <img src="/logo.png" alt="Code Differently Logo" />
            </a>
        </div>
        <ul class="header-top-menu">
            <li><a href="/">Home</a></li>
            <li><a href="#">About</a></li>
            <li><a href="/contact">Contact</a></li>
        </ul>
        <div class="header-cta">
            <a class="sign-up-button" href="#">Sign Up</a>
        </div>
    </header>

    <div class="contact-section">
        <h1 class="contact-title">Get In <em class="highlight">Touch</em></h1>
        <p class="contact-subtitle">
            Have questions? We'd love to hear from you. Send us a message!
        </p>

        <form action="/submit-contact" method="POST">
            <div class="form-group">
                <label for="name" class="form-label">
                    Full Name <span class="required">*</span>
                </label>
                <input 
                    type="text" 
                    id="name" 
                    name="name" 
                    class="form-input" 
                    required 
                    placeholder="Enter your full name"
                />
            </div>

            <div class="form-group">
                <label for="email" class="form-label">
                    Email Address <span class="required">*</span>
                </label>
                <input 
                    type="email" 
                    id="email" 
                    name="email" 
                    class="form-input" 
                    required 
                    placeholder="your.email@example.com"
                />
            </div>

            <div class="form-group">
                <label for="phone" class="form-label">
                    Phone Number
                </label>
                <input 
                    type="tel" 
                    id="phone" 
                    name="phone" 
                    class="form-input" 
                    placeholder="(123) 456-7890"
                />
            </div>

            <div class="form-group">
                <label for="message" class="form-label">
                    Message <span class="required">*</span>
                </label>
                <textarea 
                    id="message" 
                    name="message" 
                    class="form-textarea" 
                    required 
                    placeholder="Tell us how we can help you..."
                ></textarea>
            </div>

            <button type="submit" class="submit-button">
                Send Message
            </button>
        </form>
    </div>

    <footer class="footer">
        &copy; 2024 Code Differently
    </footer>
</body>
</html>
